# Vertical markers drawn on any chart with annotations enabled.
# Add entries freely -- the site reads whatever is here, and charts that would be
# cluttered by them can set annotations=False in the registry.
#
# These are shocks with a plausible claim on the shape of the curves, not a
# general timeline of energy history. The bar is that you can point at a chart
# and see the line move, which is why the nuclear accidents other than Chernobyl
# are absent: they redirected national policy without bending any of the global
# series plotted here. Announcements and pledges are absent for the same reason.

