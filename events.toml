# Vertical markers drawn on any chart with annotations enabled.
# Add entries freely -- the site reads whatever is here, and charts that would be
# cluttered by them can set annotations=False in the registry.
#
# These are shocks with a plausible claim on the shape of the curves, not a
# general timeline of energy history. The bar for inclusion is that you can
# point at a chart and see the line move. Announcements and pledges are
# deliberately absent: the Paris Agreement, the US Inflation Reduction Act and
# the COP28 tripling pledge all matter, but none of them bends a line on a date,
# and every marker added crowds the labels on the long charts.

[[event]]
