[project]
name = "energy-trends"
version = "0.1.0"
description = "Time-series charts on how much energy humanity produces and consumes, and what it comes from"
requires-python = ">=3.11"
dependencies = ["requests>=2.32"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_trends"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
